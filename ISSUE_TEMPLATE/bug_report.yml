name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See error"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Standalone
        - Connected
        - DEMO
        - Not sure
  - type: input
    id: env
    attributes:
      label: Environment / URL
      placeholder: Browser, deployment URL, commit
  - type: input
    id: jira
    attributes:
      label: Jira issue
      placeholder: KAN-123
