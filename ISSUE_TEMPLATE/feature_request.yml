name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should VERIDIUM do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which module owns it (Global, Link, Freight, Warehouse, POS, Analytics, Connections)? Does it need a contract change or a Country Pack value?
  - type: input
    id: jira
    attributes:
      label: Jira issue
      placeholder: KAN-123
